<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>诊断 - Interface Hub</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
    .card { background: #16213e; padding: 20px; margin: 10px 0; border-radius: 8px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .warning { color: #fbbf24; }
    pre { background: #0f3460; padding: 10px; border-radius: 4px; overflow-x: auto; }
    button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin: 5px; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h1>🔧 Interface Hub 诊断工具</h1>

  <div class="card">
    <h2>1. API 连接测试</h2>
    <button onclick="testDirectAPI()">测试直连 API (3001)</button>
    <button onclick="testProxyAPI()">测试代理 API (/api)</button>
    <div id="api-result"></div>
  </div>

  <div class="card">
    <h2>2. 登录测试</h2>
    <button onclick="testLogin()">测试登录</button>
    <div id="login-result"></div>
  </div>

  <div class="card">
    <h2>3. LocalStorage 检查</h2>
    <button onclick="checkLocalStorage()">检查 LocalStorage</button>
    <button onclick="clearLocalStorage()">清除 LocalStorage</button>
    <div id="storage-result"></div>
  </div>

  <div class="card">
    <h2>4. 网络请求详情</h2>
    <pre id="request-log"></pre>
  </div>

  <script>
    const log = [];
    function addLog(msg, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      log.unshift(`[${timestamp}] [${type.toUpperCase()}] ${msg}`);
      document.getElementById('request-log').textContent = log.join('\n');
    }

    async function testDirectAPI() {
      const result = document.getElementById('api-result');
      result.innerHTML = '测试中...';
      addLog('Testing direct API: http://localhost:3001/api/health');

      try {
        const res = await fetch('http://localhost:3001/api/health');
        const data = await res.json();
        result.innerHTML = `<span class="success">✅ 直连成功</span>: ${JSON.stringify(data)}`;
        addLog('Direct API OK: ' + JSON.stringify(data), 'success');
      } catch (e) {
        result.innerHTML = `<span class="error">❌ 直连失败</span>: ${e.message}`;
        addLog('Direct API FAILED: ' + e.message, 'error');
      }
    }

    async function testProxyAPI() {
      const result = document.getElementById('api-result');
      result.innerHTML = '测试中...';
      addLog('Testing proxy API: /api/health');

      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        result.innerHTML = `<span class="success">✅ 代理成功</span>: ${JSON.stringify(data)}`;
        addLog('Proxy API OK: ' + JSON.stringify(data), 'success');
      } catch (e) {
        result.innerHTML = `<span class="error">❌ 代理失败</span>: ${e.message}`;
        addLog('Proxy API FAILED: ' + e.message, 'error');
      }
    }

    async function testLogin() {
      const result = document.getElementById('login-result');
      result.innerHTML = '登录中...';
      addLog('Testing login with admin@interfacehub.com');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'admin@interfacehub.com', password: 'admin123' })
        });
        const data = await res.json();
        addLog('Login response status: ' + res.status, 'info');

        if (data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          result.innerHTML = `<span class="success">✅ 登录成功</span><br>Token: ${data.token.substring(0, 50)}...<br>User: ${data.user.email}`;
          addLog('Login SUCCESS, token stored', 'success');
        } else {
          result.innerHTML = `<span class="error">❌ 登录失败</span>: ${JSON.stringify(data)}`;
          addLog('Login FAILED: ' + JSON.stringify(data), 'error');
        }
      } catch (e) {
        result.innerHTML = `<span class="error">❌ 请求失败</span>: ${e.message}`;
        addLog('Login REQUEST FAILED: ' + e.message, 'error');
      }
    }

    function checkLocalStorage() {
      const result = document.getElementById('storage-result');
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');

      result.innerHTML = `
        <strong>Token:</strong> ${token ? token.substring(0, 50) + '...' : '<em>无</em>'}<br>
        <strong>User:</strong> ${user ? user.substring(0, 100) + '...' : '<em>无</em>'}
      `;
      addLog('LocalStorage check - Token exists: ' + !!token + ', User exists: ' + !!user);
    }

    function clearLocalStorage() {
      localStorage.clear();
      checkLocalStorage();
      addLog('LocalStorage cleared', 'warning');
      document.getElementById('storage-result').innerHTML += '<br><span class="warning">已清除</span>';
    }

    // Auto-run on load
    checkLocalStorage();
    addLog('Diagnostic page loaded');
  </script>
</body>
</html>
